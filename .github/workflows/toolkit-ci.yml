name: Build Toolkit

on:
  push:
    branches: [main]
    paths:
      - 'mac/**'
      - '.github/workflows/toolkit-ci.yml'
  pull_request:
    paths:
      - 'mac/**'
      - '.github/workflows/toolkit-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build universal app
        run: |
          xcodebuild \
            -project mac/Adm1nSysToolkit.xcodeproj \
            -scheme Adm1nSysToolkit \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/ToolkitDerived" \
            -destination "generic/platform=macOS" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify architectures
        run: |
          EXECUTABLE="$RUNNER_TEMP/ToolkitDerived/Build/Products/Release/Adm1nSysToolkit.app/Contents/MacOS/Adm1nSysToolkit"
          lipo -verify_arch arm64 "$EXECUTABLE"
          lipo -verify_arch x86_64 "$EXECUTABLE"
          lipo -archs "$EXECUTABLE"

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/ToolkitDerived/Build/Products/Release/Adm1nSysToolkit.app" \
            "$RUNNER_TEMP/Adm1nSysToolkit-universal.app.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Adm1nSysToolkit-universal
          path: ${{ runner.temp }}/Adm1nSysToolkit-universal.app.zip
